name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: brew install protobuf
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/kn dist/kn
          tar -czf "dist/kn-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz" -C dist kn
          shasum -a 256 "dist/kn-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz" \
            > "dist/kn-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: kn-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  universal:
    name: Build universal
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: kn-arm64
          path: artifacts/arm64
      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: kn-x86_64
          path: artifacts/x86_64
      - name: Combine and package
        run: |
          set -euo pipefail
          mkdir -p dist/arm64 dist/x86_64 dist/universal
          tar -xzf artifacts/arm64/kn-*-arm64.tar.gz -C dist/arm64
          tar -xzf artifacts/x86_64/kn-*-x86_64.tar.gz -C dist/x86_64
          lipo -create dist/arm64/kn dist/x86_64/kn -output dist/universal/kn
          file dist/universal/kn
          lipo -archs dist/universal/kn
          tar -czf "dist/kn-${GITHUB_REF_NAME}-universal.tar.gz" -C dist/universal kn
          shasum -a 256 "dist/kn-${GITHUB_REF_NAME}-universal.tar.gz" \
            > "dist/kn-${GITHUB_REF_NAME}-universal.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: kn-universal
          path: dist/kn-*-universal.tar.gz*
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - build
      - universal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kn-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -lh dist
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 --generate-notes
