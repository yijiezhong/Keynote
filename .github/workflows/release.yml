name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: brew install protobuf
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/kn dist/kn
          tar -czf "dist/kn-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz" -C dist kn
          shasum -a 256 "dist/kn-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz" \
            > "dist/kn-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: kn-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kn-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -lh dist
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 --generate-notes
